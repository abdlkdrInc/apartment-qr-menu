<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apartment Baskı Menüsü</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; }
    body { 
        font-family: 'Merriweather', serif; 
        margin: 0; 
        padding: 20px; 
        color: #2C2C2C; 
        background-color: #FAF8F5; /* Ekranda görünecek kağıt rengi */
    }

    /* BURASI ÇIKTI EKRANINA ÖZEL TASARIMDIR */
    @media print {
        @page {
            size: A4 portrait; /* A4 dikey kağıt boyutu */
            margin: 10mm; /* Yazıcı kenar boşlukları */
        }
        body {
            background-color: white !important; /* Çıktıda zemin tamamen beyaz olsun mürekkep yemesin */
            padding: 0;
            margin: 0;
            -webkit-print-color-adjust: exact; /* Renklerin çıktıda aynı görünmesini zorlar */
            print-color-adjust: exact;
        }
        
        /* Çıktıda görünmesini İSTEMEDİĞİN şeyleri gizle (örneğin dil butonları, ekstra boşluklar) */
        .no-print {
            display: none !important;
        }

        /* Çıktıda sayfaların bölünmesini engellemek için */
        .menu-section {
            page-break-inside: avoid;
            break-inside: avoid;
        }
    }

    /* TASARIM İSKELETİ (Geliştirilecek kısım) */
    .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #800020; padding-bottom: 10px; }
    .header img { height: 100px; }
    .content { column-count: 2; column-gap: 30px; }
    
    .menu-section { margin-bottom: 20px; }
    .category { color: #800020; font-size: 18px; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #ccc; }
    .menu-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .item-name { font-weight: 700; }
    .item-price { font-weight: 700; }
</style>
</head>
<body>

    <!-- Çıktıda çıkmayacak, sadece ekranda görünecek bilgi çubuğu -->
    <div class="no-print" style="background:#800020; color:white; text-align:center; padding:10px; margin-bottom:20px; font-family:sans-serif; border-radius:5px;">
        🖨️ Çıktı almak için <b>Ctrl + P</b> (Mac için Cmd + P) tuşlarına basın.
    </div>

    <div class="header">
        <img src="logo.png" alt="Apartment Logo">
        <h1>MENÜ</h1>
    </div>

    <div class="content">
        <!-- Buraya çıktı için özel tasarlanmış menü öğeleri gelecek -->
        <div class="menu-section">
            <div class="category">Sıcak Kahveler</div>
            <div class="menu-item"><span class="item-name">Espresso</span><span class="item-price">180 ₺</span></div>
            <div class="menu-item"><span class="item-name">Americano</span><span class="item-price">200 ₺</span></div>
            <div class="menu-item"><span class="item-name">Latte</span><span class="item-price">240 ₺</span></div>
        </div>
    </div>

</body>
</html>
