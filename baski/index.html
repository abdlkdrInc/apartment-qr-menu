<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A4 Menü Tasarımı</title>
<style>
    *, *::before, *::after { 
        box-sizing: border-box; 
    }
    
    body { 
        margin: 0; 
        padding: 20px; 
        background-color: #555; /* Ekranda sayfaların daha net görülmesi için koyu arka plan */
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        font-family: sans-serif;
    }

    /* A4 Sayfa Genel Yapısı */
    .a4-page {
        width: 210mm;
        height: 297mm;
        background-color: #FAF8F5; /* Sample görseldeki gibi hafif kırık beyaz/krem zemin */
        position: relative;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
        flex-shrink: 0;
        overflow: hidden;
    }

    /* 1. Sayfa - Çerçeveli ve Logolu Kısım */
    .page-1 {
        border: 12mm solid #9a2027; /* Sample görseldeki koyu kırmızı çerçeve */
    }

    /* Logoyu Tam Merkeze Konumlandırma */
    .center-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40%; /* Ne çok büyük ne çok küçük olacak ideal oran */
        height: auto;
    }

    /* 2. Sayfa - Menü İçerikleri vs. için ayrılan boş yapı */
    .page-2 {
        padding: 20mm;
        background-color: #FFFFFF;
    }

    /* YAZICI (PRINT) AYARLARI */
    @media print {
        body {
            background-color: transparent;
            padding: 0;
            margin: 0;
            gap: 0;
            display: block;
        }
        
        .a4-page {
            box-shadow: none;
            margin: 0;
            page-break-after: always;
            page-break-inside: avoid;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        @page {
            size: A4 portrait;
            margin: 0; /* Çerçevenin kenarlara tam sıfır oturması için */
        }
    }
</style>
</head>
<body>

    <!-- 1. SAYFA -->
    <div class="a4-page page-1">
        <img src="logo.png" alt="Apartment Logo" class="center-logo">
    </div>

    <!-- 2. SAYFA -->
    <div class="a4-page page-2">
        <!-- 2. Sayfanın içeriğini (menü maddeleri vs.) buraya ekleyebilirsiniz -->
    </div>

</body>
</html>
